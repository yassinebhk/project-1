name: How it's made daily (Factory Decoded — EN)

# Cómo se fabrican las cosas (evergreen, visual, sin YMYL). simple_channel factory.
# NO-OP (status:no_channel, cero cuota LLM) hasta crear canal YT +
# secrets YT_HOWMADE_REFRESH_TOKEN/CLIENT_ID/CLIENT_SECRET.
# LLM_CHEAP_FIRST=1 → gemma-4/Groq primero y reserva la cuota de Gemini al flagship.
# Piggyback real: también en catchup-all-channels (cron-job.org 4×/día) por si GH skipea.

on:
  schedule:
    - cron: "27 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  howmade:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: batch-once --slug howmade
      extra_env: |
        LLM_CHEAP_FIRST=1
    secrets: inherit
