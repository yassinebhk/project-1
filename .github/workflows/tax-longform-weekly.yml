name: Tax long-form weekly (RETIRADO 04/10 — canal reconvertido a Cosmos)

# RETIRADO 04/10/26: TaxHack reconvertido a Cosmos. Se quita el cron para no subir
# long-form de fiscalidad al canal renombrado. Solo workflow_dispatch.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tax_long:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: tax-longform
    secrets: inherit
