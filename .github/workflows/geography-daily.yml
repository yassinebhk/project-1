name: Map Decoded daily (geography explainer — EN)

# Canal nicho geografía/geopolítica evergreen (por qué el mapa es como es). SIN
# conflictos vivos. simple_channel factory. NO-OP hasta crear canal YT + secrets
# YT_GEOGRAPHY_*. LLM_CHEAP_FIRST=1 → gemma-4/Groq primero (reserva Gemini al flagship).
# Si el scheduler GH skipea, catchup-all-channels (20:37 UTC) lo rescata.

on:
  schedule:
    - cron: "47 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  geography:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: batch-once --slug geography
      extra_env: |
        LLM_CHEAP_FIRST=1
    secrets: inherit
