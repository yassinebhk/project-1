name: AI Decoded daily (AI explained — EN)

# Canal nicho IA explicada (conceptos/novedades, no reseñas de herramientas).
# simple_channel factory. NO-OP hasta crear canal YT + secrets YT_AINEWS_*.
# LLM_CHEAP_FIRST=1 → gemma-4/Groq primero (reserva Gemini al flagship).
# Si el scheduler GH skipea, catchup-all-channels (20:37 UTC) lo rescata.

on:
  schedule:
    - cron: "27 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ainews:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: batch-once --slug ainews
      extra_env: |
        LLM_CHEAP_FIRST=1
    secrets: inherit
