name: Tax daily (RETIRADO 04/10 — canal reconvertido a Cosmos)

# RETIRADO 04/10/26: TaxHack (5 subs, fiscalidad=YMYL, sin tracción tras 88 vídeos)
# reconvertido a Cosmos/Astronomía reutilizando su canal YT. Se quita el cron para
# NO seguir subiendo fiscalidad al canal renombrado. Queda solo workflow_dispatch
# por si se quisiera reactivar. El contenido ahora lo da el pipeline 'espacio'.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tax:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: tax-once
    secrets: inherit
