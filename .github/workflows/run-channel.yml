name: Run one channel (manual)

# Ejecuta UN comando de canal a demanda (subida REAL si tiene secrets). Útil para
# validar un canal recién activado sin esperar al catchup. Ej. command:
#   stoic-once · geoquiz-once · batch-once --slug espacio · ai-tools-once

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando videogen a ejecutar"
        required: true
        default: "stoic-once"
      extra_env:
        description: "Env extra k=v (una por línea). Ej. GEOQUIZ_PER_DAY=9 para forzar una validación saltando el tope diario."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ${{ inputs.command }}
      extra_env: ${{ inputs.extra_env }}
    secrets: inherit
