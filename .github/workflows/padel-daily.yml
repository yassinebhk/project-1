name: Pádel daily (Pádel Pro ES)

# Canal consejos de pádel con jugada recreada en pista. Voz Edge (guion curado,
# 0 LLM) + animación matplotlib. Canal YT_PADEL_*. Cron 09:07 UTC.
# ACTIVO con secrets YT_PADEL_REFRESH_TOKEN/CLIENT_ID/CLIENT_SECRET.

on:
  schedule:
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "Formato de render (manim=2D clásico, tactika=3D isométrico réplica @tactikapadel)"
        type: choice
        required: false
        default: "manim"
        options: [manim, tactika]

permissions:
  contents: write

jobs:
  padel:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: padel-once
      # Mientras GH Actions esté con billing failed, pádel corre en el bridge
      # (Mac M3 Pro, 18GB, label 'bridge'). install_spec='.' evita torch/whisper
      # (pádel no los usa) y acelera install.
      runs_on: ubuntu-latest
      install_spec: '.'
      extra_env: |
        PADEL_FORMAT=${{ inputs.format || 'manim' }}
    secrets: inherit
