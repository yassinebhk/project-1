name: Backfill IG manual

# Sube manualmente varios Shorts YT históricos a Instagram Reels (@waitwhy_).
# Útil para "poblar" la cuenta IG con contenido que ya tiene tracción en YT.
#
# Uso: Actions → "Backfill IG manual" → Run workflow → ajusta `count` y `platforms`.
#
# El backfill:
# - Busca los top-N Shorts YT por views (min 20 views, sin backfill previo a IG)
# - Descarga el mp4 vertical con yt-dlp si no está local (runner fresco)
# - Postea a IG Reels vía instagram_poster
# - Registra en output/backfill_log.json (idempotente — no repite)
# - Registra cada intento en output/ig_publish_log.json con status

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Cuántos reels IG intentar (el cap diario de 6/día lo limita salvo force)"
        required: true
        type: string
        default: "6"
      platforms:
        description: "Plataformas coma-sep (default 'instagram' solo; 'instagram,threads' para además)"
        required: false
        type: string
        default: "instagram"
      force:
        description: "Saltar el cap diario y el espaciado de IG (populate supervisado > 6/día)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: backfill-once
      # IG_MIN_GAP_MIN=0: esto es un populate supervisado y manual → puede subir
      # seguido (sin el espaciado de 4h del flujo automático), pero SIGUE
      # respetando el cap diario de 6/día salvo que marques `force`.
      # force=true → IG_RATE_BYPASS=1 salta cap y espaciado por completo.
      extra_env: |
        BACKFILL_PER_PLATFORM=${{ inputs.count }}
        BACKFILL_PLATFORMS=${{ inputs.platforms }}
        IG_MIN_GAP_MIN=0
        IG_RATE_BYPASS=${{ inputs.force == true && '1' || '0' }}
    secrets: inherit
